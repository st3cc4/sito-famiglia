<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portale Famiglia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Portale Famiglia</h1>
    </header>

    <main class="container">
        <!-- Sezione Bollette e Scadenze -->
        <section class="card">
            <div class="card-header">
                <h2>Bollette e Scadenze</h2>
                <button id="openModalBtn" class="btn-primary">Nuova bolletta</button>
            </div>
            <div id="billsList" class="list-container">
                <p>Caricamento scadenze...</p>
            </div>
        </section>
    </main>

    <!-- Modale per aggiungere una bolletta -->
    <div id="billModal" class="modal">
        <div class="modal-content">
            <span id="closeModalBtn" class="close">&times;</span>
            <h2>Aggiungi Nuova Bolletta</h2>
            <form id="billForm">
                <div class="form-group">
                    <label for="billTitle">Titolo (es. Luce, Gas, Bollo):</label>
                    <input type="text" id="billTitle" required>
                </div>
                <div class="form-group">
                    <label for="billAmount">Importo (€):</label>
                    <input type="number" step="0.01" id="billAmount" required>
                </div>
                <div class="form-group">
                    <label for="billDate">Data di Scadenza:</label>
                    <input type="date" id="billDate" required>
                </div>
                <button type="submit" class="btn-primary">Salva Bolletta</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK (Versioni compatibili con moduli o script standard) -->
    <script type="module" src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Famiglia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
</head>
<body>

    <!-- SEZIONE LOGIN -->
    <div id="auth-container" class="container">
        <div class="card auth-card">
            <h1>Famiglia 🏡</h1>
            <p class="subtitle">Accedi per gestire le scadenze</p>
            
            <form id="auth-form">
                <div class="form-group">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" name="email" autocomplete="username" required placeholder="La tua email...">
                </div>
                
                <div class="form-group">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" name="password" autocomplete="current-password" required placeholder="La tua password...">
                </div>

                <!-- Riga con Ricordami a sinistra e Pulsante Accedi a destra -->
                <div class="login-actions">
                    <div class="remember-me">
                        <input type="checkbox" id="remember-check" checked>
                        <label for="remember-check">Ricordami</label>
                    </div>
                    <button type="submit" id="auth-btn" class="btn-inline">Accedi</button>
                </div>
            </form>

            <div class="auth-links">
                <a href="#" id="forgot-password-btn">Password dimenticata?</a>
            </div>
        </div>
    </div>

    <!-- SEZIONE APP PRINCIPALE -->
    <div id="app-container" class="container" style="display: none;">
        <header class="app-header">
            <div>
                <h1>Casa Dolce Casa 🏡</h1>
                <p class="subtitle">Benvenuto, <span id="user-email-display"></span></p>
            </div>
            <button id="btn-logout" class="btn-logout">Esci</button>
        </header>

        <!-- Sezione per aggiungere una nuova scadenza -->
        <div class="card">
            <h2>Aggiungi Nuova Scadenza</h2>
            <form id="scadenza-form">
                <div class="form-group">
                    <label for="titolo">Titolo (es. Bolletta Luce, Bollo Auto)</label>
                    <input type="text" id="titolo" required placeholder="Inserisci il nome...">
                </div>
                
                <div class="form-group">
                    <label for="data">Data di Scadenza</label>
                    <input type="date" id="data" required>
                </div>

                <div class="form-group">
                    <label for="importo">Importo (€)</label>
                    <input type="number" step="0.01" id="importo" required placeholder="0.00">
                </div>

                <button type="submit" class="btn">Salva Scadenza</button>
            </form>
        </div>

        <!-- Sezione della lista scadenze -->
        <div class="card">
            <h2>Scadenze Future</h2>
            <ul id="lista-scadenze" class="lista">
                <!-- I dati verranno aggiunti automaticamente da Firebase -->
            </ul>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>

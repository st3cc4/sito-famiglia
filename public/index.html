<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Famiglia</title>
    <!-- Collegamento al file di stile -->
    <link rel="stylesheet" href="style.css">
    <!-- Collegamento al Manifest per la PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
</head>
<body>

    <div class="container">
        <h1>Casa Dolce Casa 🏡</h1>
        <p class="subtitle">Gestione scadenze e bollette di famiglia</p>

        <!-- Sezione per aggiungere una nuova scadenza -->
        <div class="card">
            <h2>Aggiungi Nuova Scadenza</h2>
            <form id="scadenza-form">
                <div class="form-group">
                    <label for="titolo">Titolo (es. Bolletta Luce, Bollo Auto)</label>
                    <input type="text" id="titolo" required placeholder="Inserisci il nome...">
                </div>
                
                <div class="form-group">
                    <label for="data">Data di Scadenza</label>
                    <input type="date" id="data" required>
                </div>

                <div class="form-group">
                    <label for="importo">Importo (€)</label>
                    <input type="number" step="0.01" id="importo" required placeholder="0.00">
                </div>

                <button type="submit" class="btn">Salva Scadenza</button>
            </form>
        </div>

        <!-- Sezione della lista scadenze -->
        <div class="card">
            <h2>Scadenze Future</h2>
            <ul id="lista-scadenze" class="lista">
                <!-- I dati verranno aggiunti automaticamente qui -->
            </ul>
        </div>
    </div>

    <!-- Collegamento al file JavaScript -->
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portale della Famiglia - STECKS & GEMINI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; }

        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: #fff; padding: 35px; border-radius: 14px; width: 360px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .auth-box h2 { margin-bottom: 10px; color: var(--primary); font-size: 24px; }
        .auth-box p { margin-bottom: 20px; color: var(--text-muted); font-size: 14px; }
        .auth-box input[type="email"], .auth-box input[type="password"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .auth-box input:focus { border-color: var(--primary); }
        
        .remember-container { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 14px; color: var(--text-muted); text-align: left; cursor: pointer; }
        .remember-container input { width: 16px; height: 16px; cursor: pointer; }

        .btn-primary { background: var(--primary); color: #fff; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 15px; transition: background 0.2s; }
        .btn-primary:hover { background: var(--primary-hover); }

        .error-msg { color: #ef4444; font-size: 13px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

    <!-- SCHERMATA DI ACCESSO -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-box">
            <h2><i class="fa-solid fa-house-chimney"></i> Portale della Famiglia</h2>
            <p>Inserisci le tue credenziali per entrare</p>
            
            <div id="error-message" class="error-msg">Email o password non validi.</div>

            <input type="email" id="auth-email" placeholder="La tua email (es. stecks@famiglia.it)">
            <input type="password" id="auth-pin" placeholder="Password o PIN">
            
            <label class="remember-container">
                <input type="checkbox" id="remember-me"> Ricordami su questo dispositivo
            </label>

            <button id="btn-login" class="btn-primary">Accedi</button>
        </div>
    </div>

    <script>
        // Simulazione utenti autorizzati della famiglia (puoi associare le mail ai nomi)
        const familyUsers = {
            "stecks@famiglia.it": { name: "Stecks", role: "Admin" },
            "elena@famiglia.it": { name: "Elena", role: "Member" },
            "sara@famiglia.it": { name: "Sara", role: "Member" },
            "giulia@famiglia.it": { name: "Giulia", role: "Member" },
            "leonardo@famiglia.it": { name: "Leonardo", role: "Member" }
        };

        // Controllo se l'utente aveva scelto "Ricordami" in precedenza
        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('family_user_email');
            if (savedEmail) {
                document.getElementById('auth-email').value = savedEmail;
                document.getElementById('remember-me').checked = true;
            }
        });

        document.getElementById('btn-login').addEventListener('click', handleLogin);
        document.getElementById('auth-pin').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        function handleLogin() {
            const email = document.getElementById('auth-email').value.trim().toLowerCase();
            const pin = document.getElementById('auth-pin').value.trim();
            const remember = document.getElementById('remember-me').checked;
            const errorBox = document.getElementById('error-message');

            // Verifica semplice (puoi personalizzare la logica delle password come preferisci)
            if (familyUsers[email]) {
                currentUser = familyUsers[email].name;
                
                if (remember) {
                    localStorage.setItem('family_user_email', email);
                } else {
                    localStorage.removeItem('family_user_email');
                }

                // Nasconde la schermata di login
                document.getElementById('auth-overlay').style.display = 'none';
                alert(`Benvenuto/a nel Portale della Famiglia, ${currentUser}!`);
            } else {
                errorBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portale Famiglia</title>

    <!-- Collegamento obbligatorio per far riconoscere la PWA -->
    <link rel="manifest" href="/manifest.json">

    <!-- Meta tag utili per dispositivi mobili -->
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- I tuoi stili CSS (puoi aggiungere o modificare a piacimento) -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <h1>Benvenuto nel Portale</h1>
    <p>La web app è pronta e installabile!</p>

    <!-- Qui andrà il resto del tuo codice HTML e la logica di Firebase -->

    <!-- Script per registrare il Service Worker e sbloccare l'installazione -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => { 
              console.log('Service Worker registrato con successo!', reg.scope); 
            })
            .catch((err) => { 
              console.log('Registrazione Service Worker fallita: ', err); 
            });
        });
      }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Famiglia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏠 Famiglia</h1>
        <p>Dashboard e Scadenze</p>
    </header>

    <main>
        <!-- Sezione Scadenze -->
        <section class="card">
            <h2>⏰ Prossime Scadenze</h2>
            <form id="scadenza-form">
                <input type="text" id="titolo-scadenza" placeholder="Es. Bolletta Luce o Bollo" required>
                <input type="date" id="data-scadenza" required>
                <button type="submit">Aggiungi Scadenza</button>
            </form>
            <ul id="lista-scadenze">
                <!-- Le scadenze compariranno qui -->
            </ul>
        </section>

        <!-- Sezione Ricette / Note Veloci -->
        <section class="card">
            <h2>🍳 Ricette e Note Veloci</h2>
            <form id="ricetta-form">
                <input type="text" id="titolo-ricetta" placeholder="Nome ricetta o nota" required>
                <textarea id="testo-ricetta" placeholder="Ingredienti o dettagli..." rows="2" required></textarea>
                <button type="submit">Salva Ricetta</button>
            </form>
            <div id="griglia-ricette">
                <!-- Le ricette compariranno qui -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>

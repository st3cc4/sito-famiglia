<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portale Famiglia</title>
    <!-- Libreria Tesseract.js per la scansione OCR delle bollette -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #2980b9;
        }
        #status {
            margin-top: 10px;
            font-style: italic;
            color: #e67e22;
        }
        /* Stile dinamico per le card degli elementi inseriti */
        .item-card {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            border-left: 6px solid #ccc; /* Il bordo sinistro prenderà il colore dell'utente */
            background-color: #fafafa;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Portale Famiglia</h1>
    
    <!-- Selezione dell'utente (Chi sta inserendo l'elemento) -->
    <div class="form-group">
        <label for="utente-select">Chi sta inserendo?</label>
        <select id="utente-select">
            <option value="Stecca">Stecca</option>
            <option value="Elena">Elena</option>
            <option value="Sara">Sara</option>
            <option value="Giulia">Giulia</option>
            <option value="Leonardo">Leonardo</option>
            <option value="Samuele">Samuele</option>
            <option value="Carlo">Carlo</option>
        </select>
    </div>

    <!-- Sezione Scansione Bolletta / Scadenza -->
    <div class="form-group">
        <label>Scatta o carica foto bolletta (OCR automatico)</label>
        <input type="file" id="bolletta-file-input" accept="image/*">
        <div id="status"></div>
    </div>

    <div class="form-group">
        <label for="ente-input">Ente / Fornitore</label>
        <input type="text" id="ente-input" placeholder="Es. Enel, Eni...">
    </div>

    <div class="form-group">
        <label for="scadenza-input">Data Scadenza</label>
        <input type="text" id="scadenza-input" placeholder="gg/mm/aaaa">
    </div>

    <div class="form-group">
        <label for="importo-input">Importo (€)</label>
        <input type="text" id="importo-input" placeholder="0.00">
    </div>

    <button id="salva-btn">Salva Attività / Scadenza</button>

    <!-- Area dove compariranno gli elementi salvati -->
    <div id="lista-elementi" style="margin-top: 20px;"></div>
</div>

<script>
    // Mappa dei colori associati a ciascun utente
    const coloriUtenti = {
        "Stecca": "#3498db",   // Blu
        "Elena": "#e74c3c",    // Rosso
        "Sara": "#9b59b6",     // Viola
        "Giulia": "#e67e22",   // Arancione
        "Leonardo": "#2ecc71", // Verde
        "Samuele": "#1abc9c",  // Turchese
        "Carlo": "#34495e"     // Grigio scuro / Antracite
    };

    // Gestione dell'evento di caricamento della foto e OCR con Tesseract.js
    const fileInput = document.getElementById('bolletta-file-input');
    if (fileInput) {
        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('status');
            statusEl.innerText = "Analisi OCR della bolletta in corso...";

            try {
                const worker = await Tesseract.createWorker('ita');
                const ret = await worker.recognize(file);
                await worker.terminate();

                const testoEstratto = ret.data.text;
                const datiEstratti = analizzaTestoBolletta(testoEstratto);

                // Riempimento automatico dei campi
                document.getElementById('ente-input').value = datiEstratti.ente;
                document.getElementById('scadenza-input').value = datiEstratti.scadenza;
                document.getElementById('importo-input').value = datiEstratti.importo;

                statusEl.innerText = "Scansione completata con successo!";
            } catch (error) {
                console.error("Errore OCR:", error);
                statusEl.innerText = "Impossibile leggere automaticamente la foto. Inserisci i dati a mano.";
            }
        });
    }

    // Funzione di supporto per estrarre Ente, Scadenza e Importo
    function analizzaTestoBolletta(testo) {
        let ente = "";
        let scadenza = "";
        let importo = "";

        const entiComuni = ["Enel", "Eni", "Servizio Elettrico Nazionale", "A2A", "Edison", "Acea", "Hera", "Iren", "Fastweb", "TIM", "Vodafone", "WindTre"];
        for (const nome of entiComuni) {
            if (new RegExp(`\\b${nome}\\b`, 'i').test(testo)) {
                ente = nome;
                break;
            }
        }

        const matchScadenza = testo.match(/(?:scadenza|entro il|scade il|pagamento entro)[:\s]*(\d{1,2}[\/\.-]\d{1,2}[\/\.-]\d{2,4})/i);
        if (matchScadenza) {
            scadenza = matchScadenza[1];
        }

        const matchImporto = testo.match(/(?:totale|importo|da pagare|euro|eur)[:\s]*[€]?\s*(\d+[\.,]\d{2})/i);
        if (matchImporto) {
            importo = matchImporto[1].replace(',', '.');
        }

        return { ente, scadenza, importo };
    }

    // Salvataggio e creazione visiva dell'elemento con il colore dell'utente
    document.getElementById('salva-btn').addEventListener('click', () => {
        const utenteSelezionato = document.getElementById('utente-select').value;
        const ente = document.getElementById('ente-input').value || "Generico";
        const scadenza = document.getElementById('scadenza-input').value || "N/D";
        const importo = document.getElementById('importo-input').value || "0.00";

        // Recupera il colore associato all'utente (di default grigio se non trovato)
        const coloreUtente = coloriUtenti[utenteSelezionato] || "#7f8c8d";

        // Crea il blocco visivo dell'elemento
        const listaElementi = document.getElementById('lista-elementi');
        const nuovaCard = document.createElement('div');
        nuovaCard.className = 'item-card';
        // Applica il colore dell'utente come bordo sinistro e un leggero sfondo colorato trasparente
        nuovaCard.style.borderLeftColor = coloreUtente;
        nuovaCard.style.backgroundColor = hexToRgba(coloreUtente, 0.08);

        nuovaCard.innerHTML = `
            <strong>Inserito da: <span style="color: ${coloreUtente};">${utenteSelezionato}</span></strong><br>
            <strong>Ente:</strong> ${ente}<br>
            <strong>Scadenza:</strong> ${scadenza}<br>
            <strong>Importo:</strong> € ${importo}
        `;

        listaElementi.prepend(nuovaCard);

        // Pulisce i campi input dopo il salvataggio
        document.getElementById('ente-input').value = "";
        document.getElementById('scadenza-input').value = "";
        document.getElementById('importo-input').value = "";
        document.getElementById('bolletta-file-input').value = "";
        document.getElementById('status').innerText = "";
    });

    // Funzione di utilità per convertire il colore HEX in RGBA per lo sfondo sfumato
    function hexToRgba(hex, alpha) {
        let c = hex.replace('#', '');
        if (c.length === 3) {
            c = c.split('').map(x => x + x).join('');
        }
        const num = parseInt(c, 16);
        return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
    }
</script>

</body>
</html>

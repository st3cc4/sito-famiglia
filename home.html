<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMIGLIA - HOME</title>
    
    <!-- FontAwesome per le Icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Foglio di Stile Principale della Home dentro la cartella home -->
    <link rel="stylesheet" href="home/stile-home.css?v=25">
</head>
<body>

    <!-- OVERLAY PER DISPOSITIVI MOBILI -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- HEADER SUPERIORE FISSO -->
    <header class="app-header">
        <div class="header-left">
            <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" title="Espandi/Contrai Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <span class="app-title" id="page-title">FAMIGLIA - HOME</span>
        </div>
        <div class="header-right">
            <span class="user-badge" id="user-display-name">Utente</span>
            <button class="btn-logout" id="btn-logout" title="Esci dall'applicazione">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <!-- STRUTTURA PRINCIPALE APP -->
    <div class="app-body">
        
        <!-- SIDEBAR BARRA LATERALE -->
        <aside class="sidebar" id="sidebar">
            
            <!-- SEZIONE NAVIGAZIONE SUPERIORE (SCORREVOLE) -->
            <div class="sidebar-nav-container">
                <button class="nav-btn active" data-target="dashboard">
                    <i class="fa-solid fa-house"></i>
                    <span class="nav-text">HOME</span>
                </button>
                <button class="nav-btn" data-target="scadenze">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                    <span class="nav-text">SCADENZE</span>
                </button>
                <button class="nav-btn" data-target="impegni">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span class="nav-text">IMPEGNI</span>
                </button>
                <button class="nav-btn" data-target="media">
                    <i class="fa-solid fa-photo-film"></i>
                    <span class="nav-text">FOTO & VIDEO</span>
                </button>
                <button class="nav-btn" data-target="ricette">
                    <i class="fa-solid fa-utensils"></i>
                    <span class="nav-text">RICETTE</span>
                </button>
                
                <!-- Menu Gestione Utenti (Visibile solo per Admin) -->
                <button class="nav-btn" id="admin-menu-item" data-target="gestione-utenti" style="display: none;">
                    <i class="fa-solid fa-users-gear"></i>
                    <span class="nav-text">GESTIONE UTENTI</span>
                </button>
            </div>

            <!-- SEZIONE INFERIORE ANCORATA FISSA IN BASSO (FOOTER) -->
            <div class="sidebar-footer">
                <button class="nav-btn" data-target="cambia-password">
                    <i class="fa-solid fa-key"></i>
                    <span class="nav-text">CAMBIA PASSWORD</span>
                </button>
                <button class="nav-btn" data-target="cambia-colore">
                    <i class="fa-solid fa-palette"></i>
                    <span class="nav-text">CAMBIA COLORE</span>
                </button>

                <div class="sidebar-user-box">
                    <i class="fa-solid fa-user-shield"></i>
                    <div class="user-info-text">
                        <span class="user-info-name" id="sidebar-username">Utente</span>
                        <span class="user-info-role" id="sidebar-user-role">Ruolo</span>
                    </div>
                </div>
            </div>

        </aside>

        <!-- TELA CENTRALE DINAMICA -->
        <main class="content-area" id="content-area">
            <!-- Il contenuto dinamico delle schede viene caricato qui via JS -->
        </main>

    </div>

    <!-- Script JavaScript Principale dentro la cartella home -->
    <script type="module" src="home/home.js?v=25"></script>

</body>
</html>

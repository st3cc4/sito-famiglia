<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Sito Famiglia</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="home/stile-home.css">
</head>
<body>

  <div class="main-container">

    <!-- SCADENZE -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-file-invoice-dollar"></i> SCADENZE
      </div>
      <div class="card-body">
        <ul class="scadenze-list" id="scadenze-list">
          <!-- Inseriti dinamicamente via JS -->
        </ul>
      </div>
    </div>

    <!-- IMPEGNI DI OGGI -->
    <div class="card">
      <div class="card-header" id="impegni-header">
        <i class="fas fa-calendar-alt"></i> IMPEGNI DI OGGI
      </div>
      <div class="card-body">
        <div id="impegni-list">
          <!-- Inseriti dinamicamente via JS -->
        </div>
      </div>
    </div>

    <!-- FOTO & VIDEO -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-images"></i> FOTO &amp; VIDEO
      </div>
      <div class="card-body">
        <div class="foto-container" id="foto-container">
          <!-- Inserita dinamicamente via JS -->
          <p style="text-align: center; color: #888;">Caricamento media...</p>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="home/home.js"></script>
</body>
</html>

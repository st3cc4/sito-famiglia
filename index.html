<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sito Famiglia</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f0f2f5;
      overflow: hidden;
    }

    /* BARRA SUPERIORE */
    header.main-header {
      background-color: #1e293b;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 100;
      height: 60px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .menu-toggle-btn {
      background: transparent;
      color: white;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .menu-toggle-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-info {
      font-size: 0.95rem;
    }

    .btn-logout {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-logout:hover {
      background-color: #dc2626;
    }

    /* LAYOUT PRINCIPALE */
    .app-body {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* MENU LATERALE */
    nav.sidebar {
      width: 250px;
      background-color: #1e293b;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 15px 10px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
      z-index: 90;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      transform: translateX(-100%);
    }

    nav.sidebar.open {
      transform: translateX(0);
    }

    .nav-btn {
      background: transparent;
      color: #cbd5e1;
      border: none;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      text-align: left;
      width: 100%;
    }

    .nav-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .nav-btn.active {
      background-color: #2563eb;
      color: white;
    }

    /* TELA CENTRALE */
    main.canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      background-color: #f0f2f5;
    }

    iframe#tela-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIORE -->
  <header class="main-header">
    <div class="header-left">
      <button class="menu-toggle-btn" id="menu-toggle" title="Apri/Chiudi Menu">
        <i class="fas fa-bars"></i>
      </button>
      <div class="brand-title">
        <i class="fas fa-home"></i> Sito Famiglia
      </div>
    </div>
    <div class="user-section">
      <span class="user-info" id="logged-user-name">Utente</span>
      <button class="btn-logout" id="btn-logout">
        <i class="fas fa-sign-out-alt"></i> Esci
      </button>
    </div>
  </header>

  <!-- CONTENITORE SIDEBAR + TELA -->
  <div class="app-body">
    <nav class="sidebar" id="main-sidebar">
      <button class="nav-btn active" data-page="home/home.html" data-nav="home">
        <i class="fas fa-desktop"></i> Home
      </button>
      <button class="nav-btn" data-page="scadenze/scadenze.html" data-nav="scadenze" id="nav-scadenze">
        <i class="fas fa-file-invoice-dollar"></i> Scadenze
      </button>
      <button class="nav-btn" data-page="impegni/impegni.html" data-nav="impegni" id="nav-impegni">
        <i class="fas fa-calendar-alt"></i> Impegni
      </button>
      <button class="nav-btn" data-page="ricette/ricette.html" data-nav="ricette" id="nav-ricette">
        <i class="fas fa-utensils"></i> Ricette
      </button>
      <button class="nav-btn" data-page="media/media.html" data-nav="media" id="nav-media">
        <i class="fas fa-images"></i> Media
      </button>
      <button class="nav-btn" data-page="gestione-utenti/gestione-utenti.html" data-nav="utenti" id="nav-utenti" style="display: none;">
        <i class="fas fa-users-cog"></i> Utenti
      </button>
      <button class="nav-btn" data-page="cambia-password/cambia-password.html" data-nav="passwords">
        <i class="fas fa-key"></i> Passwords
      </button>
    </nav>

    <main class="canvas-container">
      <iframe id="tela-iframe" src="home/home.html"></iframe>
    </main>
  </div>

  <script src="index.js"></script>
</body>
</html>

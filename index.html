<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Famiglia PWA - Login</title>
    <!-- Foglio di stile specifico per il Login dalla cartella login -->
    <link rel="stylesheet" href="login/stile-login.css">
    <!-- Icone FontAwesome per la password -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Manifest per la PWA -->
    <link rel="manifest" href="manifest.json">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <h2>Famiglia PWA</h2>
            <p class="login-subtitle">Inserisci le tue credenziali per accedere</p>

            <form id="login-form">
                <div class="input-group">
                    <label for="username">Nome</label>
                    <select id="username" required>
                        <option value="" disabled selected>Seleziona il tuo nome...</option>
                        <option value="Paolo">Paolo</option>
                        <option value="Elena">Elena</option>
                        <option value="Sara">Sara</option>
                        <option value="Giulia">Giulia</option>
                        <option value="Carlo">Carlo</option>
                        <option value="Samuele">Samuele</option>
                        <option value="Leo">Leo</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Inserisci password" required>
                        <button type="button" id="toggle-password" class="toggle-pwd-btn">
                            <i class="fa-solid fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="remember-group">
                    <label>
                        <input type="checkbox" id="remember-me" checked> Ricordami e accedi in automatico
                    </label>
                </div>

                <button type="submit" class="btn-login">Accedi</button>
                <div id="login-error" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- Script di gestione del login dalla cartella login -->
    <script type="module" src="login/login.js"></script>
</body>
</html>

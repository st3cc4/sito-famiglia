<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Famiglia - Login</title>
    <link rel="stylesheet" href="./login/stile-login.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2b3e50">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Stile per il pulsante di installazione PWA (inizialmente nascosto) */
        .btn-install-pwa {
            display: none;
            width: 100%;
            background-color: #27ae60;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s;
        }
        .btn-install-pwa:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2><i class="fa-solid fa-house-chimney"></i> FAMIGLIA</h2>
            <p>Inserisci le tue credenziali per accedere</p>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Nome Utente</label>
                <input type="text" id="username" required placeholder="Es. Paolo, Elena...">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required placeholder="La tua password">
                    <button type="button" id="toggle-password" class="btn-eye">
                        <i class="fa-solid fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-group-checkbox">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">Ricordami</label>
            </div>

            <div id="error-msg" class="error-msg" style="display: none;"></div>
            <button type="submit" class="btn-login">Accedi</button>

            <!-- Pulsante Installa App (apparirà solo se non installata) -->
            <button type="button" id="btn-install-pwa" class="btn-install-pwa">
                <i class="fa-solid fa-cloud-arrow-down"></i> Installa App Famiglia
            </button>
        </form>
    </div>

    <script type="module" src="./login/login.js"></script>
    <script>
        // Logica per gestire la comparsa del pulsante di installazione PWA
        let deferredPrompt;
        const installBtn = document.getElementById('btn-install-pwa');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Impedisce al browser di mostrare il prompt automatico standard
            e.preventDefault();
            deferredPrompt = e;
            // Mostra il nostro pulsante personalizzato
            if (installBtn) {
                installBtn.style.display = 'flex';
            }
        });

        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        console.log('Utente ha accettato l\'installazione');
                    }
                    deferredPrompt = null;
                    installBtn.style.display = 'none';
                }
            });
        }

        window.addEventListener('appinstalled', () => {
            if (installBtn) {
                installBtn.style.display = 'none';
            }
            console.log('PWA installata con successo');
        });

        // Registrazione del Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => {
                        console.log('Service Worker registrato con successo, scope:', reg.scope);
                    })
                    .catch((err) => {
                        console.error('Registrazione Service Worker fallita:', err);
                    });
            });
        }
    </script>
</body>
</html>

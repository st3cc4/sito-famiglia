<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sito Famiglia</title>    
    <!-- Link al Manifest per PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A90E2">
    <link rel="apple-touch-icon" href="icone/icona_famiglia_192x192.png">

    <!-- CSS Principale -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Barra di Navigazione -->
    <header class="app-header">
        <button id="btn-toggle-menu" class="menu-btn" aria-label="Apri Menu">&#9776;</button>
        <h1 id="header-title">Sito Famiglia</h1>
        <div id="user-badge" class="user-badge">
            <span id="user-name-display">Ospite</span>
        </div>
    </header>

    <!-- Menu Laterale (Sidebar) -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Menu</h2>
            <button id="btn-close-menu" class="close-btn">&times;</button>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="#" data-section="impegni" class="nav-link active">📅 Impegni</a></li>
                <li><a href="#" data-section="scadenze" class="nav-link">⏰ Scadenze</a></li>
                <li><a href="#" data-section="ricette" class="nav-link">🍳 Ricette</a></li>
                <li><a href="#" data-section="media" class="nav-link">🖼️ Foto e Video</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <button id="btn-logout" class="logout-btn">Seleziona Utente</button>
        </div>
    </aside>

    <!-- Overlay per chiudere il menu cliccando fuori -->
    <div id="overlay" class="overlay"></div>

    <!-- Contenuto Principale dell'App -->
    <main class="main-content">

        <!-- Sezione Impegni -->
        <section id="section-impegni" class="app-section active">
            <div class="section-header">
                <h2>📅 Appuntamenti e Impegni</h2>
                <button id="btn-add-impegno" class="add-btn">+ Nuovo Impegno</button>
            </div>
            <div id="container-impegni" class="cards-grid">
                <!-- Le schede degli impegni verranno inserite qui dinamicamente -->
            </div>
        </section>

        <!-- Sezione Scadenze -->
        <section id="section-scadenze" class="app-section">
            <div class="section-header">
                <h2>⏰ Scadenze</h2>
                <button id="btn-add-scadenza" class="add-btn">+ Nuova Scadenza</button>
            </div>
            <div id="container-scadenze" class="cards-grid">
                <!-- Le schede delle scadenze verranno inserite qui dinamicamente -->
            </div>
        </section>

        <!-- Sezione Ricette -->
        <section id="section-ricette" class="app-section">
            <div class="section-header">
                <h2>🍳 Le Nostre Ricette</h2>
                <button id="btn-add-ricetta" class="add-btn">+ Nuova Ricetta</button>
            </div>
            <div id="container-ricette" class="cards-grid">
                <!-- Le schede delle ricette verranno inserite qui dinamicamente -->
            </div>
        </section>

        <!-- Sezione Foto e Video -->
        <section id="section-media" class="app-section">
            <div class="section-header">
                <h2>🖼️ Foto e Video</h2>
                <button id="btn-add-media" class="add-btn">+ Aggiungi Media</button>
            </div>
            <div id="container-media" class="cards-grid">
                <!-- I contenuti multimediali verranno inseriti qui dinamicamente -->
            </div>
        </section>

    </main>

    <!-- Modal Cambio/Selezione Utente -->
    <div id="modal-utenti" class="modal">
        <div class="modal-content">
            <h3>Seleziona il tuo Profilo</h3>
            <div id="utenti-list" class="utenti-list">
                <!-- Lista utenti caricata da Firestore -->
            </div>
            <button id="btn-close-modal-utenti" class="close-modal-btn">Annulla</button>
        </div>
    </div>

    <!-- Script Principali JS (Module) -->
    <script type="module" src="js/app.js"></script>

    <!-- Registrazione Service Worker per PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrato con successo:', reg.scope))
                    .catch(err => console.error('Registrazione Service Worker fallita:', err));
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sito Famiglia</title>    
    <!-- Link al Manifest per PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A90E2">
    <link rel="apple-touch-icon" href="icone/icona_famiglia_192x192.png">

    <!-- CSS Principale -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Schermata / Modale di Login (Sempre attiva all'avvio se non ricordato) -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <h2>Accedi al Sito Famiglia</h2>
            <form id="form-login" class="app-form">
                <div class="form-group">
                    <label for="login-username">Nome Utente</label>
                    <input type="text" id="login-username" placeholder="Inserisci il tuo nome" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Inserisci la password" required autocomplete="current-password">
                        <button type="button" id="btn-toggle-password" class="toggle-pwd-btn" aria-label="Mostra/Nascondi Password">👁️</button>
                    </div>
                </div>
                <div class="form-checkbox">
                    <input type="checkbox" id="login-remember">
                    <label for="login-remember">Ricordami su questo dispositivo</label>
                </div>
                <div id="login-error" class="error-msg"></div>
                <button type="submit" class="save-btn login-btn">Accedi</button>
            </form>
        </div>
    </div>

    <!-- Struttura App (visibile dopo il Login) -->
    <div id="app-container" class="app-container hidden">
        <!-- Header / Barra di Navigazione -->
        <header class="app-header">
            <button id="btn-toggle-menu" class="menu-btn" aria-label="Apri Menu">&#9776;</button>
            <h1 id="header-title">Sito Famiglia</h1>
            <div id="user-badge" class="user-badge">
                <span id="user-name-display">Ospite</span>
            </div>
        </header>

        <!-- Menu Laterale (Sidebar) -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>Menu</h2>
                <button id="btn-close-menu" class="close-btn">&times;</button>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#" data-section="impegni" class="nav-link active">📅 Impegni</a></li>
                    <li><a href="#" data-section="scadenze" class="nav-link">⏰ Scadenze</a></li>
                    <li><a href="#" data-section="ricette" class="nav-link">🍳 Ricette</a></li>
                    <li><a href="#" data-section="media" class="nav-link">🖼️ Foto e Video</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="btn-logout" class="logout-btn">Esci / Disconnetti</button>
            </div>
        </aside>

        <!-- Overlay per chiudere il menu cliccando fuori -->
        <div id="overlay" class="overlay"></div>

        <!-- Contenuto Principale dell'App -->
        <main class="main-content">

            <!-- Sezione Impegni -->
            <section id="section-impegni" class="app-section active">
                <div class="section-header">
                    <h2>📅 Appuntamenti e Impegni</h2>
                    <button id="btn-add-impegno" class="add-btn">+ Nuovo Impegno</button>
                </div>
                <div id="container-impegni" class="cards-grid"></div>
            </section>

            <!-- Sezione Scadenze -->
            <section id="section-scadenze" class="app-section">
                <div class="section-header">
                    <h2>⏰ Scadenze</h2>
                    <button id="btn-add-scadenza" class="add-btn">+ Nuova Scadenza</button>
                </div>
                <div id="container-scadenze" class="cards-grid"></div>
            </section>

            <!-- Sezione Ricette -->
            <section id="section-ricette" class="app-section">
                <div class="section-header">
                    <h2>🍳 Le Nostre Ricette</h2>
                    <button id="btn-add-ricetta" class="add-btn">+ Nuova Ricetta</button>
                </div>
                <div id="container-ricette" class="cards-grid"></div>
            </section>

            <!-- Sezione Foto e Video -->
            <section id="section-media" class="app-section">
                <div class="section-header">
                    <h2>🖼️ Foto e Video</h2>
                    <button id="btn-add-media" class="add-btn">+ Aggiungi Media</button>
                </div>
                <div id="container-media" class="cards-grid"></div>
            </section>

        </main>

        <!-- Modal Nuovo Impegno -->
        <div id="modal-impegno" class="modal">
            <div class="modal-content">
                <h3>Aggiungi Nuovo Impegno</h3>
                <form id="form-impegno" class="app-form">
                    <div class="form-group">
                        <label for="impegno-titolo">Titolo</label>
                        <input type="text" id="impegno-titolo" required placeholder="Es. Visita medica">
                    </div>
                    <div class="form-group">
                        <label for="impegno-data">Data</label>
                        <input type="date" id="impegno-data" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="impegno-ora-inizio">Ora Inizio</label>
                            <input type="time" id="impegno-ora-inizio" value="00:00">
                        </div>
                        <div class="form-group">
                            <label for="impegno-ora-fine">Ora Fine</label>
                            <input type="time" id="impegno-ora-fine" value="00:00">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" id="btn-close-modal-impegno" class="cancel-btn">Annulla</button>
                        <button type="submit" class="save-btn">Salva Impegno</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal Nuova Scadenza -->
        <div id="modal-scadenza" class="modal">
            <div class="modal-content">
                <h3>Aggiungi Nuova Scadenza</h3>
                <form id="form-scadenza" class="app-form">
                    <div class="form-group">
                        <label for="scadenza-titolo">Titolo / Descrizione</label>
                        <input type="text" id="scadenza-titolo" required placeholder="Es. Bolletta Luce">
                    </div>
                    <div class="form-group">
                        <label for="scadenza-data">Data Scadenza</label>
                        <input type="date" id="scadenza-data" required>
                    </div>
                    <div class="form-group">
                        <label for="scadenza-importo">Importo (€)</label>
                        <input type="number" id="scadenza-importo" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-actions">
                        <button type="button" id="btn-close-modal-scadenza" class="cancel-btn">Annulla</button>
                        <button type="submit" class="save-btn">Salva Scadenza</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal Nuova Ricetta -->
        <div id="modal-ricetta" class="modal">
            <div class="modal-content">
                <h3>Aggiungi Nuova Ricetta</h3>
                <form id="form-ricetta" class="app-form">
                    <div class="form-group">
                        <label for="ricetta-nome">Nome Ricetta</label>
                        <input type="text" id="ricetta-nome" required placeholder="Es. Tiramisù">
                    </div>
                    <div class="form-group">
                        <label for="ricetta-ingredienti">Ingredienti (uno per riga)</label>
                        <textarea id="ricetta-ingredienti" rows="4" placeholder="Mascarpone 500g&#10;Uova 4&#10;Zucchero 100g"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="ricetta-procedimento">Procedimento (uno step per riga)</label>
                        <textarea id="ricetta-procedimento" rows="4" placeholder="Montare i tuorli con lo zucchero&#10;Aggiungere il mascarpone"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="ricetta-note">Note aggiuntive</label>
                        <input type="text" id="ricetta-note" placeholder="Es. Conservare in frigo">
                    </div>
                    <div class="form-actions">
                        <button type="button" id="btn-close-modal-ricetta" class="cancel-btn">Annulla</button>
                        <button type="submit" class="save-btn">Salva Ricetta</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Script Principali JS (Module) -->
    <script type="module" src="js/app.js"></script>

    <!-- Registrazione Service Worker per PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrato con successo:', reg.scope))
                    .catch(err => console.error('Registrazione Service Worker fallita:', err));
            });
        }
    </script>
</body>
</html>

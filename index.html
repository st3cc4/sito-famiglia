<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sito Famiglia</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="home/stile-home.css">
</head>
<body>

  <div class="main-container">

    <!-- SCADENZE -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-file-invoice-dollar"></i> SCADENZE
      </div>
      <div class="card-body">
        <ul class="scadenze-list" id="scadenze-list">
          
          <li class="scadenza-item scadenza-rosso">
            <div class="scadenza-info">
              <span class="scadenza-titolo">Klarna € 59.77</span>
              <span class="scadenza-dettaglio">04-11-2026 (Elena) Scaduta</span>
            </div>
          </li>

          <li class="scadenza-item scadenza-rosso">
            <div class="scadenza-info">
              <span class="scadenza-titolo">Dolomiti € 140.02</span>
              <span class="scadenza-dettaglio">10-11-2026 (Paolo) Tra 2 gg</span>
            </div>
          </li>

        </ul>
      </div>
    </div>

    <!-- IMPEGNI DI OGGI -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-calendar-alt"></i> IMPEGNI DI OGGI (08-11-2026)
      </div>
      <div class="card-body">
        <div class="impegno-item">
          <span><strong>Turno</strong> <small style="opacity: 0.75;">(Paolo)</small></span>
          <span class="impegno-ora"><i class="far fa-clock"></i> 09:00</span>
        </div>
      </div>
    </div>

    <!-- FOTO & VIDEO -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-images"></i> FOTO &amp; VIDEO
      </div>
      <div class="card-body">
        <div class="foto-container">
          <img src="path-della-tua-foto.jpg" alt="Foto Famiglia">
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="home/firebase-config.js"></script>
  <script type="module" src="home/home.js"></script>
</body>
</html>

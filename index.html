<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Famiglia</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="scadenze/stile_scadenze.css">
    <link rel="stylesheet" href="impegni/stile_impegni.css">
    <link rel="stylesheet" href="media/stile_media.css">
    <link rel="stylesheet" href="ricette/stile_ricette.css">
    <link rel="stylesheet" href="utenti/stile_utenti.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Menu laterale -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>Famiglia</h2>
                <button id="sidebar-toggle" class="btn-toggle" title="Chiudi menu">✕</button>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" class="nav-link active" data-section="home"><img src="icone/icona_home.png" alt="Home" class="nav-icon"> HOME</a></li>
                <li><a href="#" class="nav-link" data-section="scadenze"><img src="icone/icona_scadenze.png" alt="Scadenze" class="nav-icon"> SCADENZE</a></li>
                <li><a href="#" class="nav-link" data-section="impegni"><img src="icone/icona_impegni.png" alt="Impegni" class="nav-icon"> IMPEGNI</a></li>
                <li><a href="#" class="nav-link" data-section="media"><img src="icone/icona_media.png" alt="Foto e Video" class="nav-icon"> FOTO e VIDEO</a></li>
                <li><a href="#" class="nav-link" data-section="ricette"><img src="icone/icona_ricette.png" alt="Ricette" class="nav-icon"> RICETTE</a></li>
                <li><a href="#" class="nav-link" data-section="utenti"><img src="icone/icona_utenti.png" alt="Utenti" class="nav-icon"> UTENTI</a></li>
            </ul>
            <div class="sidebar-footer">
                <div id="utente-corrente-box" class="utente-box">Utente (Admin)</div>
                <button id="btn-cambia-password" class="btn-footer">Cambia Password</button>
                <button id="btn-cambia-colore" class="btn-footer">Cambia Colore</button>
            </div>
        </nav>

        <!-- Contenuto Principale -->
        <main class="main-content">
            <header class="main-header">
                <button id="sidebar-toggle-main" class="btn-toggle-main" title="Apri menu">☰</button>
                <h1 class="page-title">Portale Famiglia</h1>
            </header>

            <!-- Sezione Home -->
            <section id="home-section" class="content-section active">
                <h2>Benvenuti nel Portale della Famiglia</h2>
                <div class="home-grid">
                    <div class="home-card">
                        <h3>Scadenze in arrivo</h3>
                        <div id="home-summary-scadenze">Caricamento...</div>
                    </div>
                    <div class="home-card">
                        <h3>Prossimi Impegni</h3>
                        <div id="home-summary-impegni">Caricamento...</div>
                    </div>
                </div>
            </section>

            <!-- Sezione Scadenze -->
            <section id="scadenze-section" class="content-section">
                <h2>SCADENZE</h2>
                <div id="lista-scadenze"></div>
            </section>

            <!-- Sezione Impegni -->
            <section id="impegni-section" class="content-section">
                <h2>IMPEGNI</h2>
                <div id="lista-appuntamenti"></div>
            </section>

            <!-- Sezione Media (Foto e Video) -->
            <section id="media-section" class="content-section">
                <h2>FOTO e VIDEO</h2>
                <div id="lista-media" class="media-grid"></div>
            </section>

            <!-- Sezione Ricette -->
            <section id="ricette-section" class="content-section">
                <h2>RICETTE</h2>
                <div id="lista-ricette" class="ricette-grid"></div>
            </section>

            <!-- Sezione Utenti -->
            <section id="utenti-section" class="content-section">
                <h2>UTENTI</h2>
                <div id="lista-utenti" class="utenti-container"></div>
            </section>
        </main>
    </div>

    <!-- Script principali -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>

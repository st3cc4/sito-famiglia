<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FAMIGLIA - Login</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2b3e50">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2><i class="fa-solid fa-house-chimney"></i> FAMIGLIA</h2>
            <p>Inserisci la password per accedere</p>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="La tua password">
            </div>
            <div id="error-msg" class="error-msg" style="display: none;">Password errata. Riprova.</div>
            <button type="submit" class="btn-login">Accedi</button>
        </form>
    </div>

    <!-- Percorso corretto verso la sottocartella login -->
    <script type="module" src="./login/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impegni - Sito Famiglia</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="stile-impegni.css">
</head>
<body>

  <div class="main-container">

    <!-- BARRA NAVIGAZIONE MESE FISSA IN ALTO -->
    <div class="week-nav-bar">
      <button class="btn-nav-week" id="prev-week-btn" title="Mese Precedente">
        <i class="fas fa-chevron-left"></i> Prec
      </button>
      <div class="week-label" id="week-range-label">Caricamento...</div>
      <button class="btn-nav-week" id="next-week-btn" title="Mese Successivo">
        Succ <i class="fas fa-chevron-right"></i>
      </button>
    </div>

    <!-- GRIGLIA MENSILE -->
    <div class="days-container" id="days-container">
      <!-- Generato dinamicamente via JS -->
    </div>

  </div>

  <!-- POP-UP (MODALE) NUOVO / MODIFICA IMPEGNO -->
  <div class="modal-overlay" id="modal-impegno">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-form-title">Nuovo Impegno</h3>
        <button class="modal-close" id="close-modal-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="form-impegno" class="impegno-form-modal">
          <input type="hidden" id="impegno-id-edit" value="">
          <div class="input-group">
            <label for="titolo">Titolo Impegno</label>
            <input type="text" id="titolo" required placeholder="Es. Visita medica, Riunione...">
          </div>
          <div class="input-group">
            <label for="data">Data</label>
            <input type="date" id="data" required>
          </div>
          <div class="input-row">
            <div class="input-group">
              <label for="oraInizio">Ora Inizio</label>
              <input type="time" id="oraInizio" required>
            </div>
            <div class="input-group">
              <label for="oraFine">Ora Fine</label>
              <input type="time" id="oraFine" required>
            </div>
          </div>
          <div class="modal-buttons">
            <button type="button" class="btn-secondary" id="cancel-modal-btn">Annulla</button>
            <button type="submit" class="btn-primary" id="btn-salva-impegno">Salva Impegno</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- POP-UP (MODALE) DETTAGLIO IMPEGNO -->
  <div class="modal-overlay" id="modal-dettaglio">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="det-titolo-header">Dettaglio Impegno</h3>
        <button class="modal-close" id="close-det-btn">&times;</button>
      </div>
      <div class="modal-body" style="gap: 10px;">
        <div style="background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 6px;">
          <div><strong>Titolo:</strong> <span id="det-titolo">-</span></div>
          <div><strong>Data:</strong> <span id="det-data">-</span></div>
          <div><strong>Orario:</strong> <span id="det-orario">-</span></div>
          <div><strong>Autore:</strong> <span id="det-autore">-</span></div>
        </div>
        <div class="modal-buttons" style="justify-content: space-between; margin-top: 10px;">
          <button type="button" class="btn-danger" id="det-btn-elimina" style="background-color: #dc2626; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem;">Elimina</button>
          <div style="display: flex; gap: 8px;">
            <button type="button" class="btn-secondary" id="det-btn-chiudi">Chiudi</button>
            <button type="button" class="btn-primary" id="det-btn-modifica">Modifica</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="impegni.js"></script>
</body>
</html>

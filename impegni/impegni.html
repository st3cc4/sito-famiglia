<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impegni - Sito Famiglia</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="stile-impegni.css">
</head>
<body>

  <div class="main-container">

    <!-- BARRA NAVIGAZIONE SETTIMANE FISSA IN ALTO -->
    <div class="week-nav-bar">
      <button class="btn-nav-week" id="prev-week-btn" title="Settimana Precedente">
        <i class="fas fa-chevron-left"></i> Prec
      </button>
      <div class="week-label" id="week-range-label">Caricamento...</div>
      <button class="btn-nav-week" id="next-week-btn" title="Settimana Successiva">
        Succ <i class="fas fa-chevron-right"></i>
      </button>
    </div>

    <!-- CONTENITORE GIORNI DELLA SETTIMANA SCORRIBILE -->
    <div class="days-container" id="days-container">
      <!-- Generato dinamicamente via JS -->
    </div>

  </div>

  <script type="module" src="impegni.js"></script>
</body>
</html>

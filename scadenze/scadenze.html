<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scadenze - Sito Famiglia</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="stile-scadenze.css">
  <!-- Tesseract.js per il riconoscimento OCR delle immagini -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
</head>
<body>

  <div class="main-container">

    <!-- INTESTAZIONE CON PULSANTE AGGIUNGI -->
    <div class="top-action-bar">
      <h2><i class="fas fa-file-invoice-dollar"></i> Gestione Scadenze</h2>
      <button class="btn-primary" id="btn-apri-modale">
        Aggiungi Nuova Scadenza
      </button>
    </div>

    <!-- LISTA COMPLETA SCADENZE (SCROLLABILE) -->
    <div class="card">
      <div class="card-body">
        <ul class="scadenze-list" id="lista-scadenze-completa">
          <!-- Caricate dinamicamente via JS -->
        </ul>
      </div>
    </div>

  </div>

  <!-- POP-UP MODALE PER INSERIMENTO / OCR -->
  <div class="modal-overlay" id="modal-scadenza">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Nuova Scadenza</h3>
        <button class="btn-close" id="btn-chiudi-modale">&times;</button>
      </div>
      <div class="modal-body">
        
        <!-- SEZIONE OCR -->
        <div class="ocr-section">
          <label class="ocr-label">
            <i class="fas fa-camera"></i> Importa o scatta foto (OCR)
            <input type="file" id="input-ocr-file" accept="image/*" capture="environment" style="display: none;">
          </label>
          <div id="ocr-status" class="ocr-status" style="display: none;">Lettura in corso con OCR... ⏳</div>
        </div>

        <form id="form-scadenza" class="scadenza-form">
          <div class="input-group">
            <label for="titolo">Titolo / Descrizione</label>
            <input type="text" id="titolo" required placeholder="Es. Bolletta Luce, Klarna...">
          </div>
          <div class="input-group">
            <label for="importo">Importo (€)</label>
            <input type="number" step="0.01" id="importo" required placeholder="0.00">
          </div>
          <div class="input-group">
            <label for="data">Data Scadenza</label>
            <input type="date" id="data" required>
          </div>
          <div class="modal-buttons">
            <button type="button" class="btn-secondary" id="btn-annulla">Annulla</button>
            <button type="submit" class="btn-primary">Salva Scadenza</button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script type="module" src="scadenze.js"></script>
</body>
</html>

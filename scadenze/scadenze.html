<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scadenze - Sito Famiglia</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="stile-scadenze.css">
  <!-- Libreria OCR Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

  <div class="main-container">

    <!-- BARRA SUPERIORE: PULSANTE POP-UP + TOTALE -->
    <div class="top-action-bar">
      <button class="btn-primary" id="open-modal-btn">
        Aggiungi Nuova Scadenza
      </button>
      <div class="totale-box">
        Totale da pagare: <span class="totale-importo" id="totale-importo">€ 0.00</span>
      </div>
    </div>

    <!-- LISTA COMPLETA SCADENZE -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-file-invoice-dollar"></i> Tutte le Scadenze
      </div>
      <div class="card-body">
        <ul class="scadenze-list" id="lista-scadenze-completa">
          <!-- Caricate dinamicamente via JS -->
        </ul>
      </div>
    </div>

  </div>

  <!-- POP-UP (MODALE) AGGIUNGI SCADENZA -->
  <div class="modal-overlay" id="modal-scadenza">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Nuova Scadenza</h3>
        <button class="modal-close" id="close-modal-btn">&times;</button>
      </div>
      <div class="modal-body">
        
        <!-- SEZIONE OCR -->
        <div class="ocr-section">
          <label class="ocr-label">
            <i class="fas fa-camera"></i> Scansiona Bolletta / Foto (OCR)
            <input type="file" id="ocr-file-input" accept="image/*" style="display: none;">
          </label>
          <div id="ocr-status" class="ocr-status" style="display: none;">Lettura in corso con OCR... attendi qualche secondo.</div>
        </div>

        <form id="form-scadenza" class="scadenza-form-modal">
          <div class="input-group">
            <label for="titolo">Titolo / Descrizione</label>
            <input type="text" id="titolo" required placeholder="Es. Bolletta Luce, Klarna...">
          </div>
          <div class="input-group">
            <label for="importo">Importo (€)</label>
            <input type="number" step="0.01" id="importo" required placeholder="0.00">
          </div>
          <div class="input-group">
            <label for="data">Data Scadenza</label>
            <input type="date" id="data" required>
          </div>
          <div class="modal-buttons">
            <button type="button" class="btn-secondary" id="cancel-modal-btn">Annulla</button>
            <button type="submit" class="btn-primary">Salva Scadenza</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="scadenze.js"></script>
</body>
</html>

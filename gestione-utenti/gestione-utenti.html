<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Utenti</title>
    <link rel="stylesheet" href="stile-gestione-utenti.css">
    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="utenti-content-root">
        <!-- Il contenuto della gestione utenti viene generato dinamicamente da gestione-utenti.js -->
    </div>

    <!-- Script principale della sezione -->
    <script type="module">
        import { initGestioneUtentiSection } from './gestione-utenti.js';
        
        document.addEventListener("DOMContentLoaded", () => {
            const root = document.getElementById('utenti-content-root');
            if (root) {
                initGestioneUtentiSection(root);
            }
        });
    </script>
</body>
</html>
